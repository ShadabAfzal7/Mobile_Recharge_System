<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - QuickRecharge</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar-placeholder"></div>
<div class="container">
  <div class="card" style="max-width:500px;margin:0 auto;">
    <h2>Order Summary</h2>
    <div id="orderSummary" style="margin:16px 0;"></div>

    <h3>Select Payment Method</h3>
    <div class="pay-methods">
      <label><input type="radio" name="pay" value="UPI" checked> UPI</label>
      <label><input type="radio" name="pay" value="Card"> Card</label>
      <label><input type="radio" name="pay" value="Wallet"> Wallet</label>
    </div>

    <button class="btn block" id="payBtn">Pay Now</button>
  </div>
</div>
<div id="footer-placeholder"></div>
<script src="js/common.js"></script>
<script src="js/cart.js"></script>
<script>renderNavbar(''); renderFooter(); requireLogin();</script>
</body>
</html>
