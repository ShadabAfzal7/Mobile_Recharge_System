<!-- signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - QuickRecharge</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar-placeholder"></div>
<div class="container">
  <div class="card auth-box">
    <h2>Create Account</h2>
    <form id="signupForm">
      <div class="form-group"><label>Full Name</label><input type="text" id="suName" required></div>
      <div class="form-group"><label>Email</label><input type="email" id="suEmail" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="suPassword" required></div>
      <button class="btn block" type="submit">Sign Up</button>
    </form>
    <p style="margin-top:14px;">Already have an account? <a href="login.html" style="color:var(--primary)">Login</a></p>
  </div>
</div>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script>renderNavbar('');</script>
</body>
</html>
